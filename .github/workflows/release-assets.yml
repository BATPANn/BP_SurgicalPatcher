name: Attach release files

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (draft or published)
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release commit
        id: release-ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == "true" ]]; then
            ref="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          else
            ref="$RELEASE_TAG"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-ref.outputs.ref }}
          persist-credentials: false
      - name: Select the script matching the release version
        id: release-script
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import ast
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          matches = []
          for path in Path(".").glob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in tree.body:
                  if (isinstance(node, ast.Assign)
                          and any(isinstance(target, ast.Name) and target.id == "APP_VERSION" for target in node.targets)
                          and isinstance(node.value, ast.Constant)
                          and node.value.value == tag):
                      matches.append(path.name)
          if len(matches) != 1:
              raise SystemExit(f"Expected one script with APP_VERSION={tag!r}; found {matches!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"script={matches[0]}\n")
          PY
      - name: Upload missing source files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SCRIPT_FILE: ${{ steps.release-script.outputs.script }}
        run: |
          for file in "$SCRIPT_FILE" requirements.txt LICENSE; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq -- "$file"; then
              echo "$file is already attached; skipping."
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
