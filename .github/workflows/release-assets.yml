name: Attach release files

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (draft or published)
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release commit
        id: release-ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == "true" ]]; then
            ref="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          else
            ref="$RELEASE_TAG"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out the release
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-ref.outputs.ref }}
          persist-credentials: false
      - name: Upload missing source files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          for file in bp_surgicalpatcher_v2.py requirements.txt LICENSE; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq -- "$file"; then
              echo "$file is already attached; skipping."
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
